<div class="board-view">
    <div class="board-header">
        <h2>{{ board.name }}</h2>
        <div class="actions">
            <button onclick="showEditBoardNameModal()">ボード名を編集</button>
            <a href="#" onclick="goToBoards(); return false;">ボード一覧に戻る</a>
        </div>
    </div>
    <div class="lists-container" id="lists-container" data-board-id="{{ board.id }}">
        {% for list in board.lists.all %}
        <div class="list" data-list-id="{{ list.id }}" data-position="{{ list.position }}" draggable="true"
             ondragstart="handleListDragStart(event)" ondragend="handleListDragEnd(event)"
             ondragover="handleListDragOver(event)" ondrop="handleListDrop(event)">
            <div class="list-header">
                <h3>{{ list.name }}</h3>
                <div class="actions">
                    <button onclick="showEditListModal({{ list.id }}, '{{ list.name|escapejs }}')">編集</button>
                    <button onclick="deleteList({{ list.id }})">削除</button>
                </div>
            </div>
            <div class="cards-container" data-list-id="{{ list.id }}"
                 ondragover="handleCardDragOver(event)" ondrop="handleCardDrop(event)">
                {% for card in list.cards.all %}
                <div class="card" data-card-id="{{ card.id }}" data-position="{{ card.position }}" draggable="true"
                     ondragstart="handleCardDragStart(event)" ondragend="handleCardDragEnd(event)">
                    <span class="card-title">{{ card.title }}</span>
                    <div class="actions">
                        <button onclick="showEditCardModal({{ card.id }}, '{{ card.title|escapejs }}')">編集</button>
                        <button onclick="deleteCard({{ card.id }})">削除</button>
                    </div>
                </div>
                {% endfor %}
            </div>
            <button class="add-card-btn" onclick="showAddCardForm({{ list.id }})">+ カードを追加</button>
            <div id="add-card-form-{{ list.id }}" class="form-container hidden">
                <input type="text" id="new-card-title-{{ list.id }}" placeholder="カードのタイトルを入力">
                <div class="btn-group">
                    <button class="btn-primary" onclick="addCard({{ list.id }})">追加</button>
                    <button class="btn-secondary" onclick="hideAddCardForm({{ list.id }})">キャンセル</button>
                </div>
            </div>
        </div>
        {% endfor %}
        <div class="new-list">
            <button onclick="showAddListForm()">+ リストを追加</button>
            <div id="add-list-form" class="form-container hidden">
                <input type="text" id="new-list-name" placeholder="リスト名を入力">
                <div class="btn-group">
                    <button class="btn-primary" onclick="addList()">追加</button>
                    <button class="btn-secondary" onclick="hideAddListForm()">キャンセル</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="modal-container"></div>

<script>
const boardId = {{ board.id }};
let draggedCard = null;
let draggedList = null;

function goToBoards() {
    sendData({action: "boards->send_page", data: {}});
}

function showEditBoardNameModal() {
    const modal = document.getElementById('modal-container');
    modal.innerHTML = `
        <div class="modal-overlay" onclick="closeModal()">
            <div class="modal" onclick="event.stopPropagation()">
                <h3>ボード名を編集</h3>
                <input type="text" id="board-name" value="{{ board.name|escapejs }}" autofocus>
                <div class="btn-group">
                    <button class="btn-secondary" onclick="closeModal()">キャンセル</button>
                    <button class="btn-primary" onclick="updateBoardName()">保存</button>
                </div>
            </div>
        </div>
    `;
    document.getElementById('board-name').focus();
    document.getElementById('board-name').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') updateBoardName();
    });
}

function updateBoardName() {
    const name = document.getElementById('board-name').value.trim();
    if (name) {
        sendData({action: "boards->update", data: {board_id: boardId, name: name}});
        closeModal();
    }
}

function closeModal() {
    document.getElementById('modal-container').innerHTML = '';
}

function showAddListForm() {
    document.getElementById('add-list-form').classList.remove('hidden');
    document.getElementById('new-list-name').focus();
}

function hideAddListForm() {
    document.getElementById('add-list-form').classList.add('hidden');
    document.getElementById('new-list-name').value = '';
}

function addList() {
    const name = document.getElementById('new-list-name').value.trim();
    if (name) {
        sendData({action: "board_detail->add_list", data: {board_id: boardId, name: name}});
        hideAddListForm();
    }
}

function showEditListModal(listId, currentName) {
    const modal = document.getElementById('modal-container');
    modal.innerHTML = `
        <div class="modal-overlay" onclick="closeModal()">
            <div class="modal" onclick="event.stopPropagation()">
                <h3>リストを編集</h3>
                <input type="text" id="list-name" value="${currentName}" autofocus>
                <div class="btn-group">
                    <button class="btn-secondary" onclick="closeModal()">キャンセル</button>
                    <button class="btn-primary" onclick="updateList(${listId})">保存</button>
                </div>
            </div>
        </div>
    `;
    document.getElementById('list-name').focus();
    document.getElementById('list-name').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') updateList(listId);
    });
}

function updateList(listId) {
    const name = document.getElementById('list-name').value.trim();
    if (name) {
        sendData({action: "board_detail->edit_list", data: {board_id: boardId, list_id: listId, name: name}});
        closeModal();
    }
}

function deleteList(listId) {
    if (confirm('このリストを削除しますか？')) {
        sendData({action: "board_detail->remove_list", data: {board_id: boardId, list_id: listId}});
    }
}

function showAddCardForm(listId) {
    document.getElementById('add-card-form-' + listId).classList.remove('hidden');
    document.getElementById('new-card-title-' + listId).focus();
}

function hideAddCardForm(listId) {
    document.getElementById('add-card-form-' + listId).classList.add('hidden');
    document.getElementById('new-card-title-' + listId).value = '';
}

function addCard(listId) {
    const title = document.getElementById('new-card-title-' + listId).value.trim();
    if (title) {
        sendData({action: "board_detail->add_card", data: {board_id: boardId, list_id: listId, title: title}});
        hideAddCardForm(listId);
    }
}

function showEditCardModal(cardId, currentTitle) {
    const modal = document.getElementById('modal-container');
    modal.innerHTML = `
        <div class="modal-overlay" onclick="closeModal()">
            <div class="modal" onclick="event.stopPropagation()">
                <h3>カードを編集</h3>
                <input type="text" id="card-title" value="${currentTitle}" autofocus>
                <div class="btn-group">
                    <button class="btn-secondary" onclick="closeModal()">キャンセル</button>
                    <button class="btn-primary" onclick="updateCard(${cardId})">保存</button>
                </div>
            </div>
        </div>
    `;
    document.getElementById('card-title').focus();
    document.getElementById('card-title').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') updateCard(cardId);
    });
}

function updateCard(cardId) {
    const title = document.getElementById('card-title').value.trim();
    if (title) {
        sendData({action: "board_detail->edit_card", data: {board_id: boardId, card_id: cardId, title: title}});
        closeModal();
    }
}

function deleteCard(cardId) {
    if (confirm('このカードを削除しますか？')) {
        sendData({action: "board_detail->remove_card", data: {board_id: boardId, card_id: cardId}});
    }
}

function handleCardDragStart(event) {
    draggedCard = event.target;
    event.target.classList.add('dragging');
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', event.target.dataset.cardId);
}

function handleCardDragEnd(event) {
    event.target.classList.remove('dragging');
    draggedCard = null;
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
}

function handleCardDragOver(event) {
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
    const container = event.target.closest('.cards-container');
    if (container) {
        container.classList.add('drag-over');
    }
}

function handleCardDrop(event) {
    event.preventDefault();
    const container = event.target.closest('.cards-container');
    if (container && draggedCard) {
        const targetListId = container.dataset.listId;
        const cards = Array.from(container.querySelectorAll('.card:not(.dragging)'));
        let targetPosition = cards.length;

        const afterElement = getDragAfterElement(container, event.clientY);
        if (afterElement) {
            targetPosition = parseInt(afterElement.dataset.position);
        }

        sendData({
            action: "board_detail->reorder_card",
            data: {
                board_id: boardId,
                card_id: parseInt(draggedCard.dataset.cardId),
                target_list_id: parseInt(targetListId),
                target_position: targetPosition
            }
        });
    }
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
}

function handleListDragStart(event) {
    if (event.target.classList.contains('list')) {
        draggedList = event.target;
        event.target.classList.add('dragging');
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', event.target.dataset.listId);
    }
}

function handleListDragEnd(event) {
    event.target.classList.remove('dragging');
    draggedList = null;
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
}

function handleListDragOver(event) {
    event.preventDefault();
    if (draggedList) {
        event.dataTransfer.dropEffect = 'move';
    }
}

function handleListDrop(event) {
    event.preventDefault();
    if (draggedList && event.target.closest('.list')) {
        const targetList = event.target.closest('.list');
        if (targetList !== draggedList) {
            const targetPosition = parseInt(targetList.dataset.position);
            sendData({
                action: "board_detail->reorder_list",
                data: {
                    board_id: boardId,
                    list_id: parseInt(draggedList.dataset.listId),
                    target_position: targetPosition
                }
            });
        }
    }
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
}

function getDragAfterElement(container, y) {
    const draggableElements = [...container.querySelectorAll('.card:not(.dragging)')];
    return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
            return { offset: offset, element: child };
        } else {
            return closest;
        }
    }, { offset: Number.NEGATIVE_INFINITY }).element;
}
</script>
