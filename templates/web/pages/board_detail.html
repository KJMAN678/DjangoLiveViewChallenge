<div class="board-view">
    <div class="board-header">
        <h2>{{ board.name }}</h2>
        <div class="actions">
            <button onclick="showEditBoardNameModal()">ボード名を編集</button>
            <a href="#" onclick="goToBoards(); return false;">ボード一覧に戻る</a>
        </div>
    </div>
    <div class="lists-container" id="lists-container" data-board-id="{{ board.id }}">
        {% for list in board.lists.all %}
        <div class="list" data-list-id="{{ list.id }}" data-position="{{ list.position }}" draggable="true"
             ondragstart="handleListDragStart(event)" ondragend="handleListDragEnd(event)"
             ondragover="handleListDragOver(event)" ondrop="handleListDrop(event)">
            <div class="list-header">
                <h3>{{ list.name }}</h3>
                <div class="actions">
                    <button onclick="showEditListModal({{ list.id }}, '{{ list.name|escapejs }}')">編集</button>
                    <button onclick="deleteList({{ list.id }})">削除</button>
                </div>
            </div>
            <div class="cards-container" data-list-id="{{ list.id }}"
                 ondragover="handleCardDragOver(event)" ondrop="handleCardDrop(event)">
                {% for card in list.cards.all %}
                <div class="card" data-card-id="{{ card.id }}" data-position="{{ card.position }}" draggable="true"
                     ondragstart="handleCardDragStart(event)" ondragend="handleCardDragEnd(event)">
                    <span class="card-title">{{ card.title }}</span>
                    <div class="actions">
                        <button onclick="showEditCardModal({{ card.id }}, '{{ card.title|escapejs }}')">編集</button>
                        <button onclick="deleteCard({{ card.id }})">削除</button>
                    </div>
                </div>
                {% endfor %}
            </div>
            <button class="add-card-btn" onclick="showAddCardForm({{ list.id }})">+ カードを追加</button>
            <div id="add-card-form-{{ list.id }}" class="form-container hidden">
                <input type="text" id="new-card-title-{{ list.id }}" placeholder="カードのタイトルを入力">
                <div class="btn-group">
                    <button class="btn-primary" onclick="addCard({{ list.id }})">追加</button>
                    <button class="btn-secondary" onclick="hideAddCardForm({{ list.id }})">キャンセル</button>
                </div>
            </div>
        </div>
        {% endfor %}
        <div class="new-list">
            <button onclick="showAddListForm()">+ リストを追加</button>
            <div id="add-list-form" class="form-container hidden">
                <input type="text" id="new-list-name" placeholder="リスト名を入力">
                <div class="btn-group">
                    <button class="btn-primary" onclick="addList()">追加</button>
                    <button class="btn-secondary" onclick="hideAddListForm()">キャンセル</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="modal-container"></div>
